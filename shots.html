<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鏡頭表與分鏡審閱板</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0e13;--panel:#14171f;--card:#1a1e28;--line:#2a2f3c;--text:#e9e6df;--muted:#9097a6;--accent:#f0b354;--accent-soft:rgba(240,179,84,.14);--ok:#6fcf97;--bad:#eb5757;--link:#8fb4ff;--blue:#8aa4d6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:14px;line-height:1.5}
[hidden]{display:none!important}
a{color:var(--link)}
header{max-width:1500px;margin:0 auto;padding:18px 16px 6px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:21px;letter-spacing:.04em}
header .sub{color:var(--muted);font-size:13px}
header .back{margin-left:auto;font-size:13px}
.wrap{max-width:1500px;margin:0 auto;padding:6px 16px 60px}
.bar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar select,.bar input[type=text]{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;min-width:0}
.bar select{flex:1 1 180px}.bar input[type=text]{flex:1 1 180px}
.btn{background:var(--accent);color:#1a1205;border:0;border-radius:8px;padding:7px 12px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.ghost.active{background:var(--accent-soft);border-color:var(--accent);color:#fff;font-weight:700}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{color:#f08a8a;border-color:#6b3434}
.btn:disabled{opacity:.45;cursor:default}
.mode-grp{display:inline-flex;gap:4px;background:#0b0d12;padding:3px;border-radius:9px;border:1px solid var(--line)}
.msg{font-size:12.5px;color:var(--ok)}
.msg.err{color:#f3a3a3}
.empty{color:var(--muted);font-size:13px}
.thead,.row{display:grid;grid-template-columns:150px minmax(220px,1.15fr) minmax(170px,.75fr) minmax(360px,1.6fr);gap:12px}
.no .sub2{color:var(--muted);font-size:11.5px;line-height:1.4;margin:-4px 0 8px;word-break:break-word}
.rv{display:flex;flex-direction:column;gap:4px;margin:0 0 10px}
.rv .h{color:var(--muted);font-size:11.5px}
.rvb{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:4px 8px;font:inherit;font-size:12.5px;cursor:pointer;text-align:left}
.rvb.sel[data-v="todo"]{color:var(--text);border-color:var(--muted)}
.rvb.sel[data-v="ok"]{background:var(--ok);border-color:var(--ok);color:#062312;font-weight:700}
.rvb.sel[data-v="fix"]{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:700}
.rvnote{width:100%;background:#0b0d12;color:var(--text);border:1px solid #6b3434;border-radius:6px;padding:4px 6px;font:inherit;font-size:12px}
.rvat{font-size:10.5px;color:var(--muted)}
.row.rv-ok{border-left:4px solid var(--ok)}.row.rv-fix{border-left:4px solid var(--bad)}
.sb{display:block;width:100%;border:0;padding:0;background:#0b0d12;border-radius:8px;overflow:hidden;cursor:zoom-in;margin-bottom:6px}
.sb img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.sbl{font-size:11px;color:var(--muted);margin:-2px 0 6px}
.sbtns{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.sbtns label.file{cursor:pointer;position:relative;overflow:hidden}
.sbtns input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.count{font-size:13.5px}.count b{font-size:17px;color:var(--ok)}.count .fx{color:#f3a3a3}.count .td{color:var(--muted)}
.imp{flex-direction:column;align-items:stretch}
.imp .r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.imp textarea{width:100%;min-height:90px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:12px/1.5 ui-monospace,monospace}
.imp .hint{color:var(--muted);font-size:12px}
.imp input[type=file]{font-size:12.5px;color:var(--muted);max-width:100%}
.epbox{flex-direction:column;align-items:stretch}
.epbox label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;width:100%}
.epbox input,.epbox textarea{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px}
.epbox textarea{min-height:84px;resize:vertical}
.thead{padding:0 12px 6px;color:var(--muted);font-size:12px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.row.flash,.rshot.flash{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cell>.lbl{display:none;color:var(--muted);font-size:12px;margin-bottom:4px}
.no b{font-size:20px;color:var(--accent);display:block;line-height:1.2}
.no .meta{color:var(--muted);font-size:12px;margin:2px 0 8px}
.no .acts{display:flex;flex-wrap:wrap;gap:4px}
.tabs{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap}
.tab{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:2px 8px;cursor:pointer;font:inherit;font-size:12px}
.tab.sel{color:#fff;border-color:var(--accent)}
.prev{white-space:pre-wrap;word-break:break-word;font-size:12.5px;line-height:1.55;color:#d6d2c8;max-height:7.6em;overflow:hidden;position:relative;background:#0b0d12;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.prev::after{content:"";position:absolute;left:0;right:0;bottom:0;height:24px;background:linear-gradient(transparent,#0b0d12)}
textarea.ins{width:100%;min-height:220px;background:#0b0d12;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:12.5px;line-height:1.55;resize:vertical}
textarea.ins:focus{outline:none;border-color:var(--accent)}
.irow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.edited{font-size:11.5px;color:var(--accent)}
.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.as{background:var(--card);border-radius:8px;padding:3px;cursor:zoom-in;border:0;color:inherit;font:inherit;text-align:left}
.as .im{aspect-ratio:3/4;background:#0b0d12;border-radius:5px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.as img{width:100%;height:100%;object-fit:contain;display:block}
.as .n{font-size:10.5px;line-height:1.3;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.as .k{font-size:10px;color:var(--accent)}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:10px}
.pane{background:var(--card);border-radius:10px;padding:8px;min-width:0}
.pane h4{margin:0 0 6px;font-size:12.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pane h4 .t{color:var(--muted);font-weight:400;font-size:11.5px}
.stage{background:#05070b;border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;aspect-ratio:9/16;max-height:340px;margin:0 auto}
.stage.land{aspect-ratio:16/9}
.stage img,.stage video{width:100%;height:100%;object-fit:contain;display:block;background:#05070b}
.stage iframe{width:100%;height:100%;border:0;display:block;background:#05070b}
.stage .play{position:absolute;inset:auto auto 8px 50%;transform:translateX(-50%)}
.stage .none{color:var(--muted);font-size:12px;padding:10px;text-align:center}
.pinfo{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.45}
.pbtns{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.vers{display:flex;gap:4px;flex-wrap:wrap}
.ver{background:#0f121a;border:1px solid var(--line);color:var(--text);border-radius:14px;padding:1px 9px;font:inherit;font-size:12px;cursor:pointer}
.ver.sel{border-color:var(--accent);background:var(--accent-soft)}
.ver.pick::after{content:" ★";color:var(--accent)}
.vinfo{font-size:11.5px;color:var(--muted);margin-top:6px;word-break:break-all}
.vinfo .pk{color:var(--accent);font-weight:700}
.addv{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.addv .r{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.addv input[type=url]{flex:1 1 160px;min-width:0;background:#0f121a;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:inherit;font-size:12px}
.addv label.file{cursor:pointer}
.addv input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.sync{margin-top:8px;display:flex;justify-content:center}

/* ---------- 分鏡審閱板（對標 review.html 卡片視圖） ---------- */
.rv-head{margin:8px 0 12px}
.rv-head h2{margin:0 0 4px;font-size:22px;color:var(--text)}
.rv-head .rv-sub{color:var(--muted);font-size:13px;margin:0}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin:12px 0}
.sum div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sum b{display:block;font-size:18px;color:var(--accent);margin-bottom:2px}
.sum span{font-size:12px;color:var(--muted)}
.ep-notes{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:12px}
.ep-notes .nh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.ep-notes ul{margin:0;padding-left:18px;font-size:13px;color:#d6d2c8}
.ep-notes li{margin:3px 0}
nav.jump{position:sticky;top:0;z-index:15;background:rgba(12,14,19,.96);backdrop-filter:blur(6px);padding:8px 0;display:flex;flex-wrap:wrap;gap:5px;border-bottom:1px solid var(--line);margin-bottom:12px}
nav.jump a{font:12px/1 ui-monospace,monospace;padding:6px 8px;border:1px solid var(--line);border-radius:6px;color:var(--text);text-decoration:none;background:var(--card)}
nav.jump a:hover{border-color:var(--accent)}
nav.jump a.j-ok{border-color:var(--ok);color:var(--ok)}
nav.jump a.j-fix{border-color:var(--bad);color:#f3a3a3}
.rshot{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:14px 0;overflow:hidden}
.rshot.rv-ok{border-left:4px solid var(--ok)}.rshot.rv-fix{border-left:4px solid var(--bad)}
.rshot-h{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(26,30,40,.5)}
.rshot-h .id{font-size:19px;color:var(--accent);font-weight:700}
.rshot-h .tc{font-family:ui-monospace,monospace;font-size:13px}
.rshot-h .dur,.rshot-h .sec{color:var(--muted);font-size:12.5px}
.rshot-h .r-rv{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.rgrid{display:grid;grid-template-columns:minmax(0,44%) minmax(0,1fr);gap:16px;padding:14px}
@media(max-width:900px){.rgrid{grid-template-columns:1fr}}
.rframe{margin:0}
.rframe .sb{margin-bottom:8px}
.rframe .noimg{aspect-ratio:4/3;display:grid;place-items:center;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:12.5px;margin-bottom:8px;background:#0b0d12;text-align:center;padding:12px}
.rinfo dl{display:grid;grid-template-columns:76px 1fr;gap:7px 10px;margin:0}
.rinfo dt{color:var(--muted);font-size:12.5px}
.rinfo dd{margin:0;min-width:0;font-size:13px}
.rinfo .lyr{font-style:italic;color:#f3dfb0}
.rinfo .rnote{color:#f3a3a3;font-size:13px}
.refs{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.refs li{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-size:12px;cursor:zoom-in}
.refs li img{width:22px;height:22px;object-fit:cover;border-radius:3px}
.tag{display:inline-block;font-size:10.5px;border-radius:4px;padding:0 5px;border:1px solid}
.t-a{color:var(--accent);border-color:var(--accent)}.t-b{color:var(--ok);border-color:var(--ok)}.t-c{color:var(--blue);border-color:var(--blue)}.t-d{color:#f08a8a;border-color:#f08a8a}
.rshot details{margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;position:relative;background:#0b0d12}
.rshot summary{cursor:pointer;font-weight:700;font-size:13px;padding-right:60px}
.rshot details pre{white-space:pre-wrap;word-break:break-word;font:12.5px/1.6 ui-monospace,"Noto Sans TC",monospace;margin:8px 0 4px;color:#d6d2c8}
.rshot .cp{position:absolute;right:8px;top:5px;font-size:11.5px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:6px;padding:2px 8px;cursor:pointer}
.subsec{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.sublbl{font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:700;letter-spacing:.03em}
.as{position:relative}
.as .refb{position:absolute;top:5px;left:5px;background:var(--accent);color:#1a1205;font-weight:700;font-size:10px;border-radius:8px;padding:0 5px;line-height:1.45}

/* ---------- 素材選擇彈窗 ---------- */
.am-bg{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:45;padding:16px}
.am-bg.on{display:flex}
.am-dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(860px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 48px rgba(0,0,0,.55)}
.am-hd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.am-hd h3{margin:0;font-size:16px}
.am-hd .am-sub{font-size:12px;color:var(--muted)}
.am-hd .am-x{margin-left:auto}
.am-bar{padding:8px 16px;border-bottom:1px solid var(--line);background:#10131b;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px}
.am-bar .picked{color:var(--accent);font-weight:700;flex:1 1 200px}
.am-body{padding:12px 16px;overflow:auto;flex:1}
.am-up{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.am-up-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:8px}
.am-up-grid label{font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.am-up-grid input,.am-up-grid select{background:#0b0d12;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:5px 7px;font:inherit;font-size:12.5px}
.am-grp{font-size:12.5px;color:var(--accent);font-weight:700;margin:10px 0 6px}
.am-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.am-card{background:var(--card);border:1.5px solid transparent;border-radius:9px;padding:5px;cursor:pointer;text-align:left;color:inherit;font:inherit;position:relative;transition:border-color .15s}
.am-card:hover{border-color:#3a4152}
.am-card.sel{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-soft),var(--card) 65%)}
.am-card .im{aspect-ratio:4/3;background:#0b0d12;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.am-card .im.tall{aspect-ratio:3/4}
.am-card img{width:100%;height:100%;object-fit:contain;display:block}
.am-card .nm{font-size:12px;font-weight:700;margin-top:4px;line-height:1.3}
.am-card .tg{font-size:10.5px;color:var(--muted)}
.am-card .bd{position:absolute;top:7px;left:7px;background:var(--accent);color:#1a1205;font-weight:700;font-size:10.5px;border-radius:10px;padding:0 6px;display:none}
.am-card.sel .bd{display:block}
.am-ft{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center;background:#10131b}

#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:50;padding:16px;cursor:zoom-out}
#lb.on{display:flex}#lb img{max-width:100%;max-height:84vh;object-fit:contain}#lb .cap{margin-top:10px;font-size:13px;color:#ddd;text-align:center}
@media (max-width:1100px){.thead{display:none}.row{grid-template-columns:1fr}.cell>.lbl{display:block}.no{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.no .meta{margin:0}}
@media (max-width:560px){.cmp{grid-template-columns:1fr}.stage{max-height:420px}header .back{margin-left:0}}
</style>
</head>
<body>
<header>
  <h1>鏡頭表與分鏡審閱板</h1><span class="sub">多集數管理・分鏡圖・3D 預演 ⇄ 生成影片對比・卡片審閱與匯出</span>
  <a class="back" href="index.html">← 回到分鏡指令選擇器</a>
</header>
<div class="wrap">
  <div class="bar">
    <select id="listSel" title="切換集數／鏡頭表"></select>
    <button class="btn ghost sm" id="listNew" type="button">＋ 新增集數</button>
    <button class="btn ghost sm" id="listDup" type="button" title="複製目前集數與鏡頭">複製此集</button>
    <input type="text" id="listName" placeholder="集數名稱，例如：EP01 咖啡廳初遇" title="修改集數名稱">
    <button class="btn ghost sm" id="epMetaBtn" type="button">✎ 集數簡介／須知</button>
    <button class="btn ghost sm danger" id="listDel" type="button">刪除此集</button>
  </div>
  <div class="bar epbox" id="epMetaBox" hidden>
    <label>集數副標簡介（例如：風格、畫幅、總時長、參考版本）<input type="text" id="epSubInput" placeholder="例：16:9 · 日系咖啡廳寫實 · 2026-11-25 v01"></label>
    <label>審閱須知／集數備註（每行一點，會在審閱板顯示）<textarea id="epNotesInput" placeholder="例：&#10;第 1–3 鏡使用主角 A 定稿設定&#10;手部拿杯動作若微崩可用結果特寫切開"></textarea></label>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost sm" id="epMetaClose" type="button">完成收起</button></div>
  </div>
  <div class="bar">
    <div class="mode-grp" role="group" aria-label="檢視模式">
      <button class="btn ghost sm active" id="modeTable" type="button" data-mode="table">📋 表格檢視</button>
      <button class="btn ghost sm" id="modeReview" type="button" data-mode="review">🎬 分鏡審閱板（卡片式）</button>
    </div>
    <button class="btn" id="xlsxOne" type="button">匯出 Excel（此集）</button>
    <button class="btn ghost" id="xlsxAll" type="button">匯出全部（每集一分頁）</button>
    <button class="btn ghost" id="expHtml" type="button">匯出單頁審閱 HTML</button>
    <button class="btn ghost" id="expJson" type="button">匯出本集 JSON</button>
    <button class="btn ghost" id="impOpen" type="button">匯入集數／影片</button>
    <button class="btn ghost" id="copyAll" type="button">複製全部指令</button>
    <button class="btn ghost danger" id="clearAll" type="button">清空此集</button>
    <span class="msg" id="msg"></span>
  </div>
  <div class="bar imp" id="impBox" hidden>
    <div class="r"><b>匯入集數／鏡頭表（JSON）</b><span class="hint">格式同鏡頭表 JSON：可含 name（集數名）、sub（簡介）、notes（須知）、shots 陣列</span></div>
    <div class="r"><label>選 JSON 檔 <input type="file" id="impFile" accept=".json,application/json"></label></div>
    <textarea id="impText" placeholder="或把 JSON 貼在這裡" spellcheck="false"></textarea>

const SL_KEY='shotLists_v3';
let SL={active:null,lists:[]};
function slLoad(){ let d=null; try{ d=JSON.parse(localStorage.getItem(SL_KEY)||'null'); }catch(e){}
  SL=(d&&Array.isArray(d.lists))?d:{active:null,lists:[]};
  if(!SL.lists.length) SL.lists=[{id:'L'+Date.now(),name:'預設鏡頭表',sub:'',notes:'',shots:[]}];
  SL.lists.forEach(l=>{ if(l.sub==null) l.sub=''; if(l.notes==null) l.notes=''; if(!Array.isArray(l.shots)) l.shots=[]; });
  if(!SL.lists.find(l=>l.id===SL.active)) SL.active=SL.lists[0].id; }
function slSave(){ try{ localStorage.setItem(SL_KEY,JSON.stringify(SL)); return true; }catch(e){ msg('儲存失敗：瀏覽器儲存空間不足',true); return false; } }
function newId(p){ return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function mutate(fn){ slLoad(); fixIds(); const r=fn(); slSave(); return r; }
function fixIds(){ let ch=false; SL.lists.forEach(l=>l.shots.forEach(s=>{ if(!s.id){ s.id=newId('s'); ch=true; } if(!Array.isArray(s.gens)){ s.gens=[]; ch=true; } })); return ch; }
function cur(){ return SL.lists.find(l=>l.id===SL.active)||SL.lists[0]; }
function shotById(id){ return cur().shots.find(s=>s.id===id); }

const MediaDB={db:null,
  open(){ if(this.db) return Promise.resolve(this.db); return new Promise((res,rej)=>{ try{ if(!window.indexedDB) throw new Error('no indexedDB'); const r=indexedDB.open('shotMedia',1); r.onupgradeneeded=()=>{ const db=r.result; if(!db.objectStoreNames.contains('files')) db.createObjectStore('files'); }; r.onsuccess=()=>{ this.db=r.result; res(r.result); }; r.onerror=()=>rej(r.error||new Error('idb')); r.onblocked=()=>rej(new Error('blocked')); }catch(e){ rej(e); } }); },
  async tx(mode,fn){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction('files',mode); const st=t.objectStore('files'); let out; const rq=fn(st); if(rq) rq.onsuccess=()=>{ out=rq.result; }; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error||new Error('abort')); }); },
  put(k,v){ return this.tx('readwrite',st=>st.put(v,k)); },
  get(k){ return this.tx('readonly',st=>st.get(k)); },
  del(k){ return this.tx('readwrite',st=>st.delete(k)); },
  keys(){ return this.tx('readonly',st=>st.getAllKeys()); } };

async function mediaDel(k){ try{ await MediaDB.del(k); }catch(e){} }

async function loadCustomAssets(){
  try{
    const list=((await AssetDB.getAll())||[]).sort((a,b)=>(a.created||0)-(b.created||0));
    const keep=new Set(list.map(r=>r.id));
    for(const k of Object.keys(CUSTOM_SRCS)){ if(!keep.has(k)){ try{ URL.revokeObjectURL(CUSTOM_SRCS[k]); }catch(_){} delete CUSTOM_SRCS[k]; } }
    CUSTOM_RECS=list.map(rec=>{
      if(rec.blob && !CUSTOM_SRCS[rec.id]) CUSTOM_SRCS[rec.id]=URL.createObjectURL(rec.blob);

async function compressAssetImage(file){

    const draw=maxE=>{ const w0=img.naturalWidth||1, h0=img.naturalHeight||1, sc=Math.min(1,maxE/Math.max(w0,h0));

    if(!blob||blob.type!=='image/webp') blob=await new Promise(r=>cFull.toBlob(r,'image/jpeg',0.86));

async function compressFrame(file){
  const u=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error('圖片讀取失敗')); im.src=u; });
    const draw=maxE=>{ const w0=img.naturalWidth||1, h0=img.naturalHeight||1, sc=Math.min(1,maxE/Math.max(w0,h0));
      const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w0*sc)); c.height=Math.max(1,Math.round(h0*sc));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c; };
    const cF=draw(1280);
    let blob=await new Promise(r=>cF.toBlob(r,'image/webp',0.86));
    if(!blob||blob.type!=='image/webp') blob=await new Promise(r=>cF.toBlob(r,'image/jpeg',0.86));
    const cT=draw(280);

  }finally{ URL.revokeObjectURL(u); }
}
async function setShotFrame(id, file){

async function downloadBlob(blob, name){

  const genShots=ss.filter(s=>(s.gens||[]).length>0).length;

async function fillMedia(s){
  const row=document.getElementById('row-'+s.id); if(!row) return;
  // 分鏡圖全尺寸（IndexedDB）
  const frIm=row.querySelector(`[data-frimg="${CSS.escape(s.id)}"]`);
  if(frIm){
    const frec=await mediaGet('frame:'+s.id);
    if(frec&&frec.blob){ const u=objURL(frec.blob); frIm.src=u; const zb=frIm.closest('[data-a="zoom"]'); if(zb) zb.dataset.src=u; }
  }
  // 生成影片
  const gens=(s.gens||[]); let vsel=UI.view[s.id]; if(!gens.find(g=>g.id===vsel)) vsel=(gens.find(g=>g.id===s.pick)||gens.slice().sort((a,b)=>a.v-b.v).pop()||{}).id;
  const g=gens.find(x=>x.id===vsel), gs=row.querySelector('[data-gen]');
  if(g&&gs){ if(g.kind==='url'){ gs.innerHTML=`<video controls playsinline preload="metadata" src="${esc(g.url)}"></video>`; const v=gs.querySelector('video'); v.onerror=()=>{ gs.innerHTML=`<div class="none">這個網址不是可直接播放的影片檔<br><a href="${esc(g.url)}" target="_blank" rel="noopener">開啟網址 ↗</a></div>`; }; }
    else { const rec=await mediaGet('gen:'+g.id); if(rec&&rec.blob){ gs.innerHTML=`<video controls playsinline preload="metadata"></video>`; gs.querySelector('video').src=objURL(rec.blob); } else gs.innerHTML='<div class="none">找不到這個本機檔案<br>（只存在當初上傳的瀏覽器）</div>'; } }
  // 錄好的預演影片
  if(UI.live[s.id]) return;
  const pv=await mediaGet('pv:'+s.id), ps=row.querySelector('[data-pv]'), stl=row.querySelector('[data-pvst]');
  const show=(k,on)=>{ const b=row.querySelector(`[data-a="${k}"]`); if(b) b.hidden=!on; };
  show('pvvideo',!!(pv&&pv.blob||pv instanceof Blob)); show('pvdel',!!(pv&&pv.blob||pv instanceof Blob));
  const blob=pv&&(pv.blob||(pv instanceof Blob?pv:null));
  if(blob&&UI.view['pv:'+s.id]!=='thumb'){ ps.innerHTML='<video controls playsinline preload="metadata"></video>'; ps.querySelector('video').src=objURL(blob); stl.textContent='錄好的預演影片'; show('pvthumb',!!s.thumb); show('pvvideo',false); }
}

function renderAll(){
  const oldUrls=urls.splice(0); setTimeout(()=>oldUrls.forEach(u=>URL.revokeObjectURL(u)),0);
  document.querySelectorAll('#rows video').forEach(v=>{ v.removeAttribute('src'); v.load(); });
  syncModeBtns();
  renderLists(); const l=cur(), el=document.getElementById('rows');
  renderCount();
  const tcs=computeTimecodes(l.shots);
  const tcById={}; tcs.forEach(x=>{ tcById[x.id]=x; });
  const fl=document.getElementById('revFilter').value, vis=l.shots.map((s,i)=>[s,i]).filter(([s])=>!fl||((s.review&&s.review.st)||'todo')===fl);
  document.getElementById('tableHead').hidden = UI.mode!=='table';
  renderReviewTop(vis, tcs);
  if(!l.shots.length){ el.innerHTML='<div class="row" style="display:block"><div class="empty">此集還沒有鏡頭。在<a href="index.html">分鏡指令選擇器</a>組好一鏡後按「加入鏡頭表」，或按「匯入集數／影片」。</div></div>'; return; }
  if(!vis.length){ el.innerHTML='<div class="row" style="display:block"><div class="empty">沒有符合篩選的鏡頭</div></div>'; return; }
  el.innerHTML = UI.mode==='review'
    ? vis.map(([s,i])=>reviewCardHTML(s,i,l.shots.length,tcById[s.id])).join('')
    : vis.map(([s,i])=>rowHTML(s,i,l.shots.length)).join('');
  vis.forEach(([s])=>fillMedia(s));
}
function renderCount(){ const ss=cur().shots, c={todo:0,ok:0,fix:0}; ss.forEach(s=>c[(s.review&&s.review.st)||'todo']++);
  document.getElementById('revCount').innerHTML=ss.length?`可以生成 <b>${c.ok}／${ss.length}</b>　<span class="fx">要改 ${c.fix}</span>　<span class="td">待看 ${c.todo}</span>`:'<span class="td">此集沒有鏡頭</span>'; }
document.getElementById('revFilter').onchange=()=>renderAll();
function renderRow(id){ const l=cur(), i=l.shots.findIndex(s=>s.id===id); const old=document.getElementById('row-'+id); if(i<0||!old){ renderAll(); return; }
  const tcs=computeTimecodes(l.shots);
  const tmp=document.createElement('div');
  tmp.innerHTML = UI.mode==='review' ? reviewCardHTML(l.shots[i],i,l.shots.length,tcs[i]) : rowHTML(l.shots[i],i,l.shots.length);
  old.replaceWith(tmp.firstElementChild); fillMedia(l.shots[i]);
  if(UI.mode==='review') renderReviewTop(null, tcs); }

async function addVersion(id,src){
  const gid=newId('g'), now=Date.now();
  let meta={id:gid,kind:src.kind,added:now};
  if(src.kind==='file'){ try{ await MediaDB.put('gen:'+gid,{blob:src.file,name:src.file.name,type:src.file.type}); }catch(e){ msg('這個瀏覽器無法儲存本機影片（私密模式、空間不足或 IndexedDB 被封鎖），請改貼網址',true); return; }
    Object.assign(meta,{name:src.file.name,size:src.file.size,type:src.file.type}); }
  else meta.url=src.url;
  let v=0; mutate(()=>{ const o=shotById(id); if(!o) return; const mx=Math.max(0,o.gnext?o.gnext-1:0,...o.gens.map(x=>x.v)); v=mx+1; meta.v=v; o.gnext=v+1; o.gens.push(meta); });
  if(!v){ if(src.kind==='file') mediaDel('gen:'+gid); msg('找不到這一鏡',true); return; }
  UI.view[id]=gid; saveView(); renderRow(id); msg(`已加入 v${v}`);
}

function normShot(s,i,keep){
  const st=s.state&&typeof s.state==='object'?JSON.parse(JSON.stringify(s.state)):{};
  st.f=Object.assign({no:s.no||('S'+String(i+1).padStart(2,'0')),extra:'',content:'',line:'',next:'',section:'',beat:'',trans:'',mainAct:'',note:''},st.f||{});
  if(st.dur==null&&s.dur!=null) st.dur=s.dur; if(!st.aspect&&s.aspect) st.aspect=s.aspect;
  const o={state:st,text:String(s.text||s.zh||''),zh:String(s.zh||''),en:String(s.en||''),
    assetsInfo:Array.isArray(s.assetsInfo)?s.assetsInfo.map((a,j)=>({id:String(a.id||('a'+j)),ref:a.ref||j+1,n:String(a.n||''),s:String(a.s||''),f:String(a.f||''),kind:String(a.kind||'角色'),thumb:a.thumb?String(a.thumb):''})):[],
    pvInfo:s.pvInfo||null,thumb:s.thumb?String(s.thumb):'',frameThumb:s.frameThumb?String(s.frameThumb):'',frameCap:s.frameCap?String(s.frameCap):'',sub:s.sub?String(s.sub):'',pvFile:s.pvFile?String(s.pvFile):'',
    updated:Date.now(),imported:true};
  if(s.row&&typeof s.row==='object') o.row=s.row;
  if(keep){ Object.assign(o,{id:keep.id,gens:keep.gens||[],pick:keep.pick||null,gnext:keep.gnext,review:keep.review||{st:'todo'},created:keep.created||Date.now()}); }
  else Object.assign(o,{id:newId('s'),gens:[],review:(s.review&&REV[s.review.st])?{st:s.review.st,note:s.review.note||'',at:s.review.at||0}:{st:'todo'},created:Date.now()});
  return o;
}
async function importVideos(files,list){ let ok=0; const miss=[];
  for(const f of files){ const k=vidNo(f.name); const sh=list.shots.find(s=>noKey(s.state&&s.state.f&&s.state.f.no)===k||(s.pvFile&&s.pvFile.split('/').pop()===f.name));
    if(!sh){ miss.push(f.name); continue; }
    try{ await MediaDB.put('pv:'+sh.id,{blob:f,name:f.name,type:f.type||'video/webm'}); MEDIA_KEYS.add('pv:'+sh.id); ok++; }catch(e){ miss.push(f.name+'（無法儲存）'); } }
  try{ localStorage.setItem('shotMediaPing',String(Date.now())); }catch(_){}
  return {ok,miss}; }
function genName(name){ const b=String(name).split(/[\\/]/).pop(); const m=/^(.+?)[-_ ]v(\d+)\.[a-z0-9]+$/i.exec(b); return m?{no:noKey(m[1]),v:+m[2]}:null; }
async function importGens(files,listId){ let ok=0; const skip=[], miss=[];
  for(const f of files){ const g=genName(f.name); if(!g){ miss.push(f.name+'（檔名要像 S01-v1.mp4）'); continue; }
    slLoad(); const l=SL.lists.find(x=>x.id===listId); const sh=l&&l.shots.find(s=>noKey(s.state&&s.state.f&&s.state.f.no)===g.no);
    if(!sh){ miss.push(f.name); continue; } if((sh.gens||[]).some(x=>x.v===g.v)){ skip.push(f.name); continue; }
    const gid=newId('g'); try{ await MediaDB.put('gen:'+gid,{blob:f,name:f.name,type:f.type||'video/mp4'}); }catch(e){ miss.push(f.name+'（無法儲存）'); continue; }
    let added=false; mutate(()=>{ const l2=SL.lists.find(x=>x.id===listId), o=l2&&l2.shots.find(s=>s.id===sh.id); if(!o) return; o.gens=o.gens||[]; if(o.gens.some(x=>x.v===g.v)) return;
      o.gens.push({id:gid,kind:'file',v:g.v,name:f.name,size:f.size,type:f.type||'video/mp4',added:Date.now(),imported:true}); o.gnext=Math.max(o.gnext||1,g.v+1); added=true; });
    if(added) ok++; else { skip.push(f.name); await mediaDel('gen:'+gid); } }
  return {ok,skip,miss}; }
function genMsg(r){ return `生成影片 ${r.ok} 支${r.skip.length?`（已存在略過 ${r.skip.length}）`:''}${r.miss.length?'（對不上：'+r.miss.join('、')+'）':''}`; }
document.getElementById('impGo').onclick=async()=>{
  let d; const raw=document.getElementById('impText').value.trim(); if(!raw){ impMsg('先選 JSON 檔或貼上 JSON',true); return; }
  try{ d=JSON.parse(raw); }catch(e){ impMsg('JSON 格式錯誤：'+e.message,true); return; }
  const arr=Array.isArray(d)?d:(d&&Array.isArray(d.shots)?d.shots:null);
  if(!arr||!arr.length){ impMsg('JSON 裡沒有 shots 陣列',true); return; }
  const bad=arr.findIndex(s=>!s||typeof s!=='object'||!(s.text||s.zh||s.en)); if(bad>=0){ impMsg(`第 ${bad+1} 鏡沒有指令（text／zh／en）`,true); return; }
  const name=String((d&&d.name)||'匯入集數').slice(0,80), rep=document.getElementById('impReplace').checked;
  const sub=String((d&&d.sub)||''), notes=String((d&&d.notes)||'');
  slLoad(); fixIds(); const before=JSON.stringify(SL);
  let l=rep?SL.lists.find(x=>x.name===name):null; const old=l?l.shots.slice():[];
  const byNo={}; old.forEach(s=>{ byNo[noKey(s.state&&s.state.f&&s.state.f.no)]=s; });
  const ss=arr.map((s,i)=>{ const st=s.state||{}, no=noKey((st.f&&st.f.no)||s.no||('S'+String(i+1).padStart(2,'0'))); const k=byNo[no]; if(k) delete byNo[no]; return normShot(s,i,k); });
  if(!l&&SL.lists.length===1&&!SL.lists[0].shots.length&&SL.lists[0].name==='預設鏡頭表') l=SL.lists[0];
  if(l){ l.shots=ss; l.name=name; if(sub) l.sub=sub; if(notes) l.notes=notes; } else { l={id:'L'+Date.now(),name,sub,notes,shots:ss}; SL.lists.push(l); }
  SL.active=l.id;
  if(!slSave()){ try{ localStorage.setItem(SL_KEY,before); }catch(_){} slLoad(); impMsg('儲存空間不足，沒有匯入（縮圖太大？）',true); return; }
  for(const s of Object.values(byNo)) await dropMedia(s);
  let vmsg=''; const vf=[...(document.getElementById('impVid').files||[])];
  if(vf.length){ const r=await importVideos(vf,l); vmsg=`，預演影片 ${r.ok} 支${r.miss.length?'（對不上：'+r.miss.join('、')+'）':''}`; }
  const gf=[...(document.getElementById('impGen').files||[])]; if(gf.length) vmsg+='，'+genMsg(await importGens(gf,l.id));
  renderAll(); const kept=old.length-Object.keys(byNo).length;
  impMsg(`已匯入「${name}」${ss.length} 鏡${old.length?`（取代舊集；${kept} 鏡保留檢收狀態）`:''}${vmsg}`); msg('匯入完成');
};
document.getElementById('impVidOnly').onclick=async()=>{ const vf=[...(document.getElementById('impVid').files||[])], gf=[...(document.getElementById('impGen').files||[])]; if(!vf.length&&!gf.length){ impMsg('先選預演影片或生成影片檔',true); return; }
  slLoad(); const l=cur(); let m=[], any=0; if(vf.length){ const r=await importVideos(vf,l); any+=r.ok; m.push(`預演影片 ${r.ok} 支${r.miss.length?'（對不上：'+r.miss.join('、')+'）':''}`); }
  if(gf.length){ const r=await importGens(gf,l.id); any+=r.ok+r.skip.length; m.push(genMsg(r)); }
  renderAll(); impMsg(`「${l.name}」：${m.join('，')}`,!any); };

/* ---------- 單鏡參考素材選擇彈窗（支援預設 13 項＋自訂上傳，並同步指令） ---------- */
let AM = { shotId: null, picked: [] };
function syncShotPromptAssets(o, refs, extra){
  // 1. 結構化指令
  {
    const lines=String(o.text||'').split('\n'), kept=[];
    for(let i=0;i<lines.length;i++){
      if(lines[i].startsWith('【參考圖】')){
        while(i+1<lines.length && /^　(@圖片|其他：)/.test(lines[i+1])) i++;
        continue;
      }
      if(lines[i].startsWith('【一致性】')) continue;
      kept.push(lines[i]);
    }
    const block=(refs.length||extra)?['【參考圖】（依序上傳）',...refs.map(r=>`　@圖片${r.ref}：${r.n}［${r.s}］${r.f}`),...(extra?[`　其他：${extra}`]:[])]:[];
    const headIdx=kept.findIndex(l=>/^【鏡號/.test(l));
    kept.splice(headIdx>=0?headIdx+1:0, 0, ...block);
    if(refs.length){
      const pvIdx=kept.findIndex(l=>/^【站位/.test(l));
      kept.splice(pvIdx>=0?pvIdx:kept.length, 0, '【一致性】人物五官、髮型、服裝嚴格依照對應參考圖，不可自行更改');
    }
    o.text=kept.join('\n');
  }
  // 2. 單段中文
  if(o.zh){
    const parts=String(o.zh).split('，').filter(p=>!/^(?:場景|道具)?依@圖片\d+（/.test(p));
    const refsZh=refs.map(r=>`${r.kind==='場景'?'場景':(r.kind==='道具'?'道具':'')}依@圖片${r.ref}（${r.n}）`);
    const idx=parts.findIndex(p=>/單鏡頭/.test(p));
    parts.splice(idx>=0?idx+1:0, 0, ...refsZh);
    o.zh=parts.join('，');
  }
  // 3. English
  if(o.en){
    if(/^\[References\]/m.test(o.en)){
      const rTxt=refs.length?('[References] '+refs.map(r=>`image ${r.ref}: ${r.en}`).join('; ')):'[References] none';
      o.en=o.en.replace(/^\[References\].*$/m, rTxt);
    } else {
      const parts=String(o.en).split(', ').filter(p=>!/^@image\d+\s+is\s+/i.test(p));
      const refsEn=refs.map(r=>`@image${r.ref} is ${r.en}`);
      const idx=parts.findIndex(p=>/aspect ratio/i.test(p));
      parts.splice(idx>=0?idx+1:Math.min(1,parts.length), 0, ...refsEn);
      o.en=parts.join(', ');
    }
  }
}
function renderAssetModal(){
  const wrap=document.getElementById('amGridWrap');
  let h='';
  DEF_GROUPS.forEach(gr=>{
    const customItems=CUSTOM_RECS.filter(c=>c.group===gr.g);
    const items=gr.items.map(it=>DEF_MAP[it.id]).concat(customItems);
    h+=`<div class="am-grp">${esc(gr.g)}${gr.scene?'（建議每鏡只選一個場景）':''}</div><div class="am-grid">`;
    items.forEach(it=>{
      const idx=AM.picked.indexOf(it.id);
      const src=it.custom?(CUSTOM_SRCS[it.id]||it.thumb||fallbackAssetSvg(it)):it.thumb;
      h+=`<button type="button" class="am-card${idx>=0?' sel':''}" data-amid="${esc(it.id)}"><div class="im${it.tall?' tall':''}"><img src="${esc(src)}" alt="${esc(it.n)}"></div><span class="bd">@圖片${idx+1}</span><div class="nm">${esc(it.n)}</div><div class="tg">${esc(it.s||'自訂')}</div></button>`;
    });
    h+=`</div>`;
  });
  wrap.innerHTML=h;
  const names=AM.picked.map((id,i)=>{ const a=getAssetById(id); return `@圖片${i+1} ${a?a.n:id}`; });
  document.getElementById('amPickedText').textContent=names.length?('已選：'+names.join('、')):'尚未選擇素材';
}
async function openAssetModal(shotId){
  await loadCustomAssets();
  const l=cur(), i=l.shots.findIndex(x=>x.id===shotId), s=l.shots[i];
  if(!s) return;
  AM.shotId=shotId;
  const curIds=(s.state&&Array.isArray(s.state.assets)&&s.state.assets.length)?s.state.assets:(s.assetsInfo||[]).map(a=>a.id);
  AM.picked=curIds.filter(id=>!!getAssetById(id));
  document.getElementById('amShotLabel').textContent=`鏡號 ${shotNo(s,i)}｜依點選順序編號 @圖片1、@圖片2…`;
  document.getElementById('amUpBox').hidden=true;
  document.getElementById('amUpMsg').textContent='';
  renderAssetModal();
  document.getElementById('assetModal').classList.add('on');
}
function closeAssetModal(){ document.getElementById('assetModal').classList.remove('on'); AM.shotId=null; }
document.getElementById('amClose').onclick=closeAssetModal;
document.getElementById('amCancel').onclick=closeAssetModal;
document.getElementById('assetModal').addEventListener('click',e=>{ if(e.target.id==='assetModal') closeAssetModal(); });
document.getElementById('amClear').onclick=()=>{ AM.picked=[]; renderAssetModal(); };
document.getElementById('amUpToggle').onclick=()=>{ const b=document.getElementById('amUpBox'); b.hidden=!b.hidden; if(!b.hidden) document.getElementById('amName').focus(); };
document.getElementById('amGridWrap').addEventListener('click',e=>{
  const c=e.target.closest('[data-amid]'); if(!c) return;
  const id=c.dataset.amid, idx=AM.picked.indexOf(id);
  if(idx>=0) AM.picked.splice(idx,1); else AM.picked.push(id);
  renderAssetModal();
});
document.getElementById('amFile').onchange=e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const nm=document.getElementById('amName'); if(!nm.value.trim()) nm.value=f.name.replace(/\.[^.]+$/,'').slice(0,30);
};
document.getElementById('amUploadBtn').onclick=async()=>{
  const fi=document.getElementById('amFile'), f=fi.files&&fi.files[0], um=document.getElementById('amUpMsg');
  const name=document.getElementById('amName').value.trim();
  if(!f){ um.textContent='請先選擇圖片檔'; um.classList.add('err'); return; }
  if(!name){ um.textContent='請輸入資產名稱'; um.classList.add('err'); document.getElementById('amName').focus(); return; }
  um.textContent='壓縮儲存中…'; um.classList.remove('err');
  try{
    const {blob, thumb, w, h}=await compressAssetImage(f);
    const id='cust-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    const rec={id, n:name, en:document.getElementById('amEn').value.trim(), group:document.getElementById('amCat').value,
      s:document.getElementById('amStatus').value.trim()||'自訂', f:`本機上傳：${f.name}（${w}×${h}）`, cat:false, blob, thumb, created:Date.now()};
    await AssetDB.put(rec);
    try{ localStorage.setItem('shotAssetsPing', String(Date.now())); }catch(_){}
    await loadCustomAssets();
    AM.picked.push(id);
    fi.value=''; document.getElementById('amName').value=''; document.getElementById('amEn').value='';
    document.getElementById('amUpBox').hidden=true;
    renderAssetModal();
    msg(`已上傳並勾選「${name}」`);
  }catch(e){ um.textContent='儲存失敗：'+(e&&e.message||''); um.classList.add('err'); }
};
document.getElementById('amApply').onclick=()=>{
  const sid=AM.shotId; if(!sid) return;
  const refs=AM.picked.map((id,i)=>{ const a=getAssetById(id); if(!a) return null;
    return {id, ref:i+1, n:a.n, s:a.s, f:a.f, en:a.en, kind:a.kind, custom:!!a.custom, thumb:a.thumb||a.src||''}; }).filter(Boolean);
  mutate(()=>{
    const o=shotById(sid); if(!o) return;
    o.state=o.state&&typeof o.state==='object'?o.state:{};
    o.state.assets=refs.map(r=>r.id);
    o.assetsInfo=refs.map(({en,...rest})=>rest);
    if(o.row&&typeof o.row==='object') o.row['參考圖（依序上傳）']=refs.map(r=>`@圖片${r.ref} ${r.n}｜${r.f}`).join('\n');
    const extra=(o.state.f&&o.state.f.extra)||'';
    syncShotPromptAssets(o, refs, extra);
    o.updated=Date.now();
  });
  closeAssetModal();
  renderAll();
  msg(`已更新參考素材（${refs.length} 項）並同步指令`);
};

/* ---------- 跨頁同步 ---------- */
window.addEventListener('storage',e=>{
  if(e.key==='shotMediaPing'){ slLoad(); refreshMediaKeys().then(()=>{ cur().shots.forEach(s=>{ if(!UI.live[s.id]) fillMedia(s); }); }); return; }
  if(e.key==='shotAssetsPing'){ loadCustomAssets().then(()=>renderAll()); return; }
  if(e.key===SL_KEY){ const ae=document.activeElement; if(ae&&(ae.matches('textarea.ins,.rvnote,#epNotesInput')||ae.id==='listName'||ae.id==='epSubInput')) { slLoad(); renderLists(); return; } slLoad(); loadCustomAssets().then(()=>refreshMediaKeys()).then(()=>renderAll()); }
});

(async()=>{
  await loadCustomAssets();
  await refreshMediaKeys();
  slLoad(); if(fixIds()) slSave();
  const hp=new URLSearchParams((location.hash||'').replace(/^#/,'')); const lid=hp.get('list');
  if(lid&&SL.lists.find(l=>l.id===lid)&&SL.active!==lid){ SL.active=lid; slSave(); }
  renderAll();
  const sid=hp.get('shot');
  if(sid){ const r=document.getElementById('row-'+sid); if(r){ r.classList.add('flash'); r.scrollIntoView({block:'center'}); setTimeout(()=>r.classList.remove('flash'),2500); } }
})();
</script>
